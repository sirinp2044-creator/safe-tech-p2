<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe Tech ป.2 | เข้าสู่ระบบนักเรียน</title><link rel="stylesheet" href="style.css"></head><body>
<div class="login-page"><div class="login-card">
<div class="login-logo">🛡️</div><h1>Safe Tech ป.2</h1><p>การใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย<br>ห้องเรียนออนไลน์สำหรับนักเรียน</p>
<div class="card" style="margin-top:20px;background:#f8fbff">
<h3 style="margin-top:0">👧🧒 เข้าสู่ระบบนักเรียน</h3>
<div class="field"><label>ชื่อ–นามสกุล</label><input id="studentName" placeholder="เช่น ด.ช.ต้นกล้า ใจดี"></div>
<div class="field"><label>ชั้น / ห้อง</label><input id="studentClass" placeholder="เช่น ป.2/1"></div>
<div class="field"><label>เลขที่</label><input id="studentNo" type="number" min="1" placeholder="เช่น 15"></div>
<button class="btn primary" style="width:100%;margin-top:5px" onclick="startStudentLogin()">🚀 เข้าสู่บทเรียน</button>
<p class="login-note">ไม่ต้องใช้รหัสผ่าน ระบบจะบันทึกชื่อ ชั้น เลขที่ และผลการทำแบบทดสอบไว้ในเบราว์เซอร์ของเครื่องนี้ เพื่อให้ครูตรวจสอบได้จากหน้า “ครูผู้สอน”</p>
</div>
<div class="teacher-entry">สำหรับครูผู้สอน → <a href="teacher.html">เข้าสู่พื้นที่ครู</a></div>
</div></div><script src="app.js"></script></body></html>
